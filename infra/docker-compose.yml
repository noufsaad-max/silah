version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: silah
      POSTGRES_PASSWORD: silah
      POSTGRES_DB: silah
    ports:
      - "5432:5432"
    volumes:
      - silah_pg_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
    volumes:
      - ../backend:/app

  frontend:
    build:
      context: ../frontend
    env_file:
      - ../frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev
    volumes:
      - ../frontend:/app
      - /app/node_modules

volumes:
  silah_pg_data:
